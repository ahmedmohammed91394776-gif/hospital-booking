<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى ميت فضالة الخيري | حجز موعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: white; padding: 1rem 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; color: #0284c7; font-weight: 800; font-size: 1.3rem; }
        .container { max-width: 650px; margin: 2rem auto; padding: 0 1rem; width: 100%; }
        .card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .full-width { grid-column: 1 / -1; }
        label { font-weight: 600; font-size: 0.9rem; color: #475569; }
        input, select { padding: 0.75rem; border: 1.5px solid #e2e8f0; border-radius: 8px; outline: none; background: #f8fafc; font-size: 0.95rem; }
        input:focus, select:focus { border-color: #0284c7; background: white; }
        .btn { background: linear-gradient(135deg, #0284c7, #0d9488); color: white; border: none; padding: 0.9rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { opacity: 0.95; }
        .alert { display: none; background: #dcfce7; color: #166534; padding: 1rem; border-radius: 8px; margin-top: 1rem; text-align: center; font-weight: 600; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

    <header>
        <i class="fa-solid fa-hospital fa-lg"></i>
        <span>مستشفى ميت فضالة الخيري</span>
    </header>

    <div class="container">
        <div class="card">
            <h2 style="text-align: center; color: #0f172a;">احجز موعدك الآن</h2>
            <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-top: 4px;">املأ البيانات التالية وسيتم تأكيد حجزك فوراً</p>

            <form id="bookingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>التخصص الطبي</label>
                        <select id="specialty" required>
                            <option value="">اختر التخصص...</option>
                            <option value="باطنة">باطنة</option>
                            <option value="أطفال">أطفال</option>
                            <option value="عظام">عظام</option>
                            <option value="أسنان">أسنان</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الطبيب المعالج</label>
                        <select id="doctor" required>
                            <option value="">اختر الطبيب...</option>
                            <option value="د. أحمد محمود">د. أحمد محمود</option>
                            <option value="د. سارة علي">د. سارة علي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>تاريخ الحجز</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>الوقت المفضّل</label>
                        <select id="time" required>
                            <option value="">اختر الوقت...</option>
                            <option value="صباحاً (10 - 2)">صباحاً (10:00 ص - 02:00 م)</option>
                            <option value="مساءً (6 - 10)">مساءً (06:00 م - 10:00 م)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>اسم المريض الثلاثي</label>
                        <input type="text" id="name" placeholder="اكتب اسمك كاملاً" required>
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="phone" placeholder="01XXXXXXXXX" required>
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="btn"><i class="fa-solid fa-paper-plane"></i> تأكيد الحجز الآن</button>
                    </div>
                </div>
            </form>
            <div id="successMsg" class="alert"><i class="fa-solid fa-circle-check"></i> تم إرسال حجزك بنجاح! سنتواصل معك قريباً لتأكيد الموعد.</div>
        </div>
    </div>

    <script>
        // ضع رابط قاعدة بيانات Firebase الخاصة بك هنا
        const FIREBASE_DB_URL ="https://hospital-booking-39343-default-rtdb.firebaseio.com"; 

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                specialty: document.getElementById('specialty').value,
                doctor: document.getElementById('doctor').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                status: 'معلق',
                createdAt: new Date().toLocaleString('ar-EG')
            };

            try {
                await fetch(`${FIREBASE_DB_URL}/bookings.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                document.getElementById('successMsg').style.display = 'block';
                this.reset();
                setTimeout(() => document.getElementById('successMsg').style.display = 'none', 5000);
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال، يرجى إعادة المحاولة.');
            }
        });
    </script>
</body>
</html>
