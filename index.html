<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى ميت فضالة الخيري | حجز موعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #1e293b; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); padding: 1rem 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; color: #0284c7; font-weight: 800; font-size: 1.3rem; }
        .container { max-width: 650px; margin: 2rem auto; padding: 0 1rem; width: 100%; }
        .card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border-radius: 20px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.3); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; margin-top: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .full-width { grid-column: 1 / -1; }
        label { font-weight: 700; font-size: 0.9rem; color: #334155; }
        input, select { padding: 0.85rem; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; background: #f8fafc; font-size: 0.95rem; font-weight: 600; transition: all 0.2s; }
        input:focus, select:focus { border-color: #0284c7; background: #ffffff; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15); }
        .btn { background: linear-gradient(135deg, #0284c7, #0d9488); color: white; border: none; padding: 1rem; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 1.05rem; display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3); }
        .alert { display: none; background: #dcfce7; color: #166534; padding: 1rem; border-radius: 10px; margin-top: 1rem; text-align: center; font-weight: 700; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

    <header>
        <i class="fa-solid fa-hospital fa-lg"></i>
        <span>مستشفى ميت فضالة الخيري</span>
    </header>

    <div class="container">
        <div class="card">
            <h2 style="text-align: center; color: #0f172a; font-weight: 800;">احجز موعدك الآن</h2>
            <p style="text-align: center; color: #64748b; font-size: 0.95rem; margin-top: 4px; font-weight: 600;">املأ البيانات التالية وسيتم تأكيد حجزك فوراً</p>

            <form id="bookingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>التخصص الطبي</label>
                        <select id="specialty" required>
                            <option value="">اختر التخصص...</option>
                            <option value="باطنة">باطنة</option>
                            <option value="أطفال">أطفال</option>
                            <option value="عظام">عظام</option>
                            <option value="أسنان">أسنان</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الطبيب المعالج</label>
                        <select id="doctor" required>
                            <option value="">اختر الطبيب...</option>
                            <option value="د. أحمد محمود">د. أحمد محمود</option>
                            <option value="د. سارة علي">د. سارة علي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>تاريخ الحجز</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>الوقت المفضّل</label>
                        <select id="time" required>
                            <option value="">اختر الوقت...</option>
                            <option value="الفترة الأولى (3 ظهراً - 6 مساءً)">الفترة الأولى (03:00 ظهراً - 06:00 مساءً)</option>
                            <option value="الفترة الثانية (6 مساءً - 9 مساءً)">الفترة الثانية (06:00 مساءً - 09:00 مساءً)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>اسم المريض الثلاثي</label>
                        <input type="text" id="name" placeholder="اكتب اسمك كاملاً" required>
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف (أرقام فقط)</label>
                        <input type="tel" id="phone" placeholder="01XXXXXXXXX" pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="btn"><i class="fa-solid fa-paper-plane"></i> تأكيد الحجز الآن</button>
                    </div>
                </div>
            </form>
            <div id="successMsg" class="alert"><i class="fa-solid fa-circle-check"></i> تم إرسال حجزك بنجاح! سنتواصل معك قريباً لتأكيد الموعد.</div>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://hospital-booking-39343-default-rtdb.firebaseio.com"; 

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                specialty: document.getElementById('specialty').value,
                doctor: document.getElementById('doctor').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                status: 'معلق',
                createdAt: new Date().toLocaleString('ar-EG')
            };

            try {
                await fetch(`${FIREBASE_DB_URL}/bookings.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                document.getElementById('successMsg').style.display = 'block';
                this.reset();
                setTimeout(() => document.getElementById('successMsg').style.display = 'none', 5000);
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال، يرجى إعادة المحاولة.');
            }
        });
    </script>
</body>
</html>
