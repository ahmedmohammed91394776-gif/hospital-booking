<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مستشفى ميت فضالة الخيري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: #f1f5f9; color: #0f172a; padding-bottom: 2rem; }
        header { background: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 15px; }
        input, select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .btn-add { background: #0284c7; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        th { background: #f8fafc; color: #64748b; font-weight: 700; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .pending { background: #fef3c7; color: #d97706; }
        .confirmed { background: #dcfce7; color: #15803d; }
        .btn-action { border: none; background: none; cursor: pointer; font-size: 1.1rem; margin-left: 6px; }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>مستشفى ميت فضالة الخيري</h2>
            <small style="color: #94a3b8;">لوحة التحكم وإدارة الحجوزات</small>
        </div>
        <button onclick="requestNotification()" style="padding: 8px 15px; background: #22c55e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
            <i class="fa-solid fa-bell"></i> تفعيل الإشعارات والتنبيهات
        </button>
    </header>

    <div class="container">
        
        <!-- نموذج الإدارة: يمكنك الحجز منه بنفسك -->
        <div class="card">
            <h3><i class="fa-solid fa-user-plus"></i> إضافة حجز جديد بواسطة الإدارة</h3>
            <form id="adminBookingForm">
                <div class="grid-form">
                    <input type="text" id="aName" placeholder="اسم المريض" required>
                    <input type="tel" id="aPhone" placeholder="رقم الهاتف" required>
                    <select id="aSpec" required>
                        <option value="">التخصص...</option>
                        <option value="باطنة">باطنة</option>
                        <option value="أطفال">أطفال</option>
                        <option value="عظام">عظام</option>
                        <option value="أسنان">أسنان</option>
                    </select>
                    <select id="aDoc" required>
                        <option value="">الطبيب...</option>
                        <option value="د. أحمد محمود">د. أحمد محمود</option>
                        <option value="د. سارة علي">د. سارة علي</option>
                    </select>
                    <input type="date" id="aDate" required>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> حفظ الحجز</button>
                </div>
            </form>
        </div>

        <!-- جدول الحجوزات: يعرض كل الذين سجلوا -->
        <div class="card">
            <h3><i class="fa-solid fa-list-check"></i> الحجوزات القادمة المباشرة</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>اسم المريض</th>
                            <th>رقم الهاتف</th>
                            <th>التخصص / الطبيب</th>
                            <th>الموعد والوقت</th>
                            <th>الحالة</th>
                            <th>إجراءات الإدارة</th>
                        </tr>
                    </thead>
                    <tbody id="adminTable">
                        <!-- تُحمل الحجوزات تلقائياً هنا -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ضع رابط قاعدة بيانات Firebase الخاصة بك هنا
        const FIREBASE_DB_URL = "https://hospital-booking-39343-default-rtdb.firebaseio.com"; 
        let previousCount = 0;

        function requestNotification() {
            Notification.requestPermission().then(perm => {
                if(perm === 'granted') alert('تم تفعيل نظام الإشعارات الصوتية والمصورة بنجاح!');
            });
        }

        // تشغيل صوت + إشعار عند حجز جديد
        function triggerAlert(patientName) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.frequency.value = 850;
            osc.start();
            osc.stop(ctx.currentTime + 0.4);

            if (Notification.permission === 'granted') {
                new Notification("حجز جديد! 🩺", {
                    body: `قام المريض [ ${patientName} ] بتسجيل حجز جديد الآن.`
                });
            }
        }

        // جلب البيانات وقراءتها كل فترة
        async function fetchBookings() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/bookings.json`);
                const data = await res.json();
                const tbody = document.getElementById('adminTable');
                tbody.innerHTML = '';

                if(!data) return;

                const keys = Object.keys(data);
                if (previousCount > 0 && keys.length > previousCount) {
                    const lastItem = data[keys[keys.length - 1]];
                    triggerAlert(lastItem.name);
                }
                previousCount = keys.length;

                for (let id in data) {
                    const item = data[id];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><b>${item.name}</b></td>
                        <td>${item.phone}</td>
                        <td>${item.specialty} (${item.doctor})</td>
                        <td>${item.date} <br><small style="color:#64748b">${item.time || ''}</small></td>
                        <td><span class="badge ${item.status === 'مؤكد' ? 'confirmed' : 'pending'}">${item.status}</span></td>
                        <td>
                            <button class="btn-action" style="color:#16a34a" onclick="toggleStatus('${id}', '${item.status}')" title="تأكيد / تعليق"><i class="fa-solid fa-check-double"></i></button>
                            <button class="btn-action" style="color:#dc2626" onclick="deleteBooking('${id}')" title="حذف الحجز"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            } catch(e) {}
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'مؤكد' ? 'معلق' : 'مؤكد';
            await fetch(`${FIREBASE_DB_URL}/bookings/${id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ status: newStatus })
            });
            fetchBookings();
        }

        async function deleteBooking(id) {
            if(confirm('هل تريد حذف هذا الحجز نهائياً؟')) {
                await fetch(`${FIREBASE_DB_URL}/bookings/${id}.json`, { method: 'DELETE' });
                fetchBookings();
            }
        }

        // إضافة حجز مباشر من الإدارة
        document.getElementById('adminBookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('aName').value,
                phone: document.getElementById('aPhone').value,
                specialty: document.getElementById('aSpec').value,
                doctor: document.getElementById('aDoc').value,
                date: document.getElementById('aDate').value,
                time: 'حجز مباشر (إدارة)',
                status: 'مؤكد',
                createdAt: new Date().toLocaleString('ar-EG')
            };

            await fetch(`${FIREBASE_DB_URL}/bookings.json`, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            this.reset();
            fetchBookings();
        });

        // الاستعلام والتحديث المستمر كل 4 ثوانٍ
        setInterval(fetchBookings, 4000);
        fetchBookings();
    </script>
</body>
</html>
